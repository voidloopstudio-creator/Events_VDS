services:
  - type: web
    name: voidloops-event-site
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: STAFF_PASSWORD_HASH
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ANALYTICS_PEPPER
        generateValue: true
